<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gyro Shop Digital Menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
:root {
  color-scheme: dark;
  --bg: #0a0a0b;
  --panel: #151517;
  --panel-2: #1e1e21;
  --gold: #d8b46a;
  --gold-dim: #8c7440;
  --text: #f3efe7;
  --muted: #aaa49b;
  --line: #2c2c30;
  --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
}
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.col { max-width: 560px; margin-inline: auto; padding-inline: 16px; }

.key { height: 14px; color: var(--gold-dim); background:
  linear-gradient(currentColor,currentColor) 0 12px/100% 1px no-repeat,
  repeating-linear-gradient(90deg,transparent 0 2px,currentColor 2px 14px,transparent 14px 16px) 0 1px/100% 1px no-repeat,
  repeating-linear-gradient(90deg,transparent 0 13px,currentColor 13px 14px,transparent 14px 16px) 0 2px/100% 10px no-repeat,
  repeating-linear-gradient(90deg,transparent 0 2px,currentColor 2px 3px,transparent 3px 16px) 0 2px/100% 7px no-repeat,
  repeating-linear-gradient(90deg,transparent 0 3px,currentColor 3px 9px,transparent 9px 16px) 0 8px/100% 1px no-repeat,
  repeating-linear-gradient(90deg,transparent 0 8px,currentColor 8px 9px,transparent 9px 16px) 0 5px/100% 3px no-repeat; }

.home-head { padding-block: 28px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.6rem, 7vw, 2.2rem); letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); margin: 0; text-wrap: balance; }
.tagline { margin: 0; font-size: 0.82rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
.home-head .key { width: 160px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-bottom: 28px; }
.tile { position: relative; display: block; width: 100%; aspect-ratio: 1 / 1.08; border-radius: 10px; overflow: hidden; background: var(--panel); }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
.tile::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(to bottom, rgba(10,10,11,0.92) 0%, rgba(10,10,11,0.55) 26%, rgba(10,10,11,0) 48%); }
.tile::after { content: ""; position: absolute; inset: 6px; z-index: 2; border: 1px solid var(--gold-dim); border-radius: 6px; pointer-events: none; }
.tile span { position: absolute; z-index: 3; top: 16px; left: 8px; right: 8px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: clamp(0.95rem, 4.4vw, 1.2rem); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
.tile:hover img { transform: scale(1.03); }
@media (prefers-reduced-motion: reduce) { .tile img { transition: none; } .tile:hover img { transform: none; } }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: rgba(12,12,13,0.97); border-bottom: 1px solid var(--line); }
.bar-top { display: flex; align-items: center; gap: 10px; padding-block: 10px 6px; }
.back { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--gold); font-size: 1.5rem; line-height: 1; }
.bar-name { min-width: 0; font-family: var(--font-display); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; padding: 10px 10px 9px; min-height: 44px; font-size: 0.95rem; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-current="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--gold); }

.sec { padding-top: 26px; scroll-margin-top: 118px; }
.sec h2 { margin: 0 0 6px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
.sec h3 { margin: 18px 0 2px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }
.items { list-style: none; margin: 0; padding: 0; }
.items li { border-bottom: 1px dotted var(--line); }
.row { width: 100%; display: flex; align-items: stretch; gap: 14px; padding-block: 12px; min-height: 44px; }
.row-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-name { font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
.row-note { font-size: 0.9rem; color: var(--muted); }
.row-price { margin-top: auto; padding-top: 8px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--gold); }
.row img { flex: none; width: 88px; height: 88px; object-fit: cover; border-radius: 6px; background: var(--panel); }
.foot { padding-block: 34px 40px; text-align: center; color: var(--muted); font-size: 0.85rem; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.foot .key { width: 160px; }

.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,0.9); display: grid; place-items: center; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.card { width: min(100%, 460px); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--gold-dim); border-radius: 12px; }
.card img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 11px 11px 0 0; }
.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; }
.card-name { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); }
.card-note { margin: 0; color: var(--muted); }
.card-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; }
.card-price { font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.close { min-height: 44px; padding: 0 18px; border: 1px solid var(--gold-dim); border-radius: 22px; color: var(--gold); font-weight: 600; }
</style>
</head>
<body>
<div id="home">
  <div class="col">
    <header class="home-head">
      <h1 class="brand">Your Shop Name</h1>
      <p class="tagline">Gyros &amp; Souvlaki · Miami Beach</p>
      <div class="key" aria-hidden="true"></div>
    </header>
    <nav class="grid" id="grid" aria-label="Menu categories"></nav>
    <footer class="foot">
      <div class="key" aria-hidden="true"></div>
      <span>1014 71st St, Miami Beach, FL 33141</span>
    </footer>
  </div>
</div>

<div id="menu" hidden>
  <div class="bar">
    <div class="col">
      <div class="bar-top">
        <button class="back" id="back" type="button" aria-label="Back to categories">&#8249;</button>
        <span class="bar-name">Your Shop Name</span>
      </div>
      <nav class="tabs" id="tabs" aria-label="Jump to category"></nav>
    </div>
  </div>
  <main class="col" id="list"></main>
  <div class="col">
    <footer class="foot">
      <div class="key" aria-hidden="true"></div>
      <span>1014 71st St, Miami Beach, FL 33141</span>
    </footer>
  </div>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetName">
  <div class="card">
    <img id="sheetImg" src="" alt="">
    <div class="card-body">
      <h2 class="card-name" id="sheetName"></h2>
      <p class="card-note" id="sheetNote"></p>
      <div class="card-row">
        <span class="card-price" id="sheetPrice"></span>
        <button class="close" id="sheetClose" type="button">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var CATS = [
    { id: "wraps", name: "Wraps", cover: "pork-gyros", groups: [{ items: [
      { n: "Chicken gyros", d: "On a pita", p: "$12.50", img: "chicken-gyros" },
      { n: "Pork gyros", d: "On a pita", p: "$12.50", img: "pork-gyros" },
      { n: "Chicken souvlaki", d: "On a bun or pita", p: "$12.50", img: "chicken-souvlaki-wrap" },
      { n: "Pork souvlaki", d: "On a bun or pita", p: "$12.50", img: "pork-souvlaki-wrap" }
    ] }] },
    { id: "entrees", name: "Entrees", cover: "souvlaki-dinner", groups: [{ items: [
      { n: "Gyros dinner", d: "Pork or chicken", p: "$22.50", img: "gyros-dinner" },
      { n: "Souvlaki dinner", d: "Pork or chicken", p: "$22.50", img: "souvlaki-dinner" },
      { n: "Beef kabob dinner", d: "", p: "$24.00", img: "beef-kabob-dinner" },
      { n: "Lamb chops dinner", d: "", p: "$34.00", img: "lamb-chops-dinner" }
    ] }] },
    { id: "salads", name: "Salads", cover: "village-salad", groups: [{ items: [
      { n: "Greek salad", d: "", p: "$13.50", img: "greek-salad" },
      { n: "Village salad", d: "", p: "$15.00", img: "village-salad" }
    ] }] },
    { id: "sides", name: "Sides", cover: "french-fries", groups: [{ items: [
      { n: "Pita bread", d: "", p: "$2.50", img: "pita-bread" },
      { n: "Rice", d: "", p: "$7.00", img: "rice" },
      { n: "French fries", d: "", p: "$7.50", img: "french-fries" },
      { n: "Souvlaki stick", d: "Pork or chicken", p: "$7.50", img: "souvlaki-stick" },
      { n: "Spanakopita", d: "", p: "$7.50", img: "spanakopita" },
      { n: "Roast potatoes", d: "", p: "$8.00", img: "roast-potatoes" },
      { n: "Baked veggies", d: "", p: "$8.00", img: "baked-veggies" }
    ] }] },
    { id: "desserts", name: "Desserts", cover: "baklava", groups: [{ items: [
      { n: "Baklava", d: "", p: "$6.00", img: "baklava" },
      { n: "Galaktoboureko", d: "", p: "$6.00", img: "galaktoboureko" },
      { n: "Bougatsa", d: "", p: "$6.00", img: "bougatsa" },
      { n: "Cheesecake", d: "", p: "$6.00", img: "cheesecake" }
    ] }] },
    { id: "drinks", name: "Drinks", cover: "frappe", groups: [{ items: [
      { n: "Bottled water", d: "", p: "$2.00", img: "bottled-water" },
      { n: "Canned soda", d: "", p: "$2.50", img: "canned-soda" },
      { n: "Coffee", d: "", p: "$3.00", img: "coffee" },
      { n: "Bottled juice", d: "", p: "$3.50", img: "bottled-juice" },
      { n: "Frappe", d: "", p: "$4.00", img: "frappe" },
      { n: "Cappuccino", d: "", p: "$5.00", img: "cappuccino" },
      { n: "Espresso", d: "", p: "$5.00", img: "espresso" }
    ] }] },
    { id: "catering", name: "Catering", cover: "catering-cover", groups: [
      { title: "Appetizers", items: [
        { n: "Hummus", d: "Serves 5–6", p: "$15.00", img: "hummus" },
        { n: "Tirokafteri", d: "Spicy feta spread · serves 5–6", p: "$15.00", img: "tirokafteri" },
        { n: "Feta cheese", d: "Serves 5–6", p: "$18.00", img: "feta" },
        { n: "Pita bread", d: "Each", p: "$2.50", img: "pita-bread" },
        { n: "Spanakopita", d: "Each", p: "$7.00", img: "spanakopita" }
      ] },
      { title: "Meats", items: [
        { n: "Gyros tray, small", d: "Chicken or pork · serves 10", p: "$75.00", img: "gyros-tray" },
        { n: "Gyros tray, large", d: "Chicken or pork · serves 20", p: "$150.00", img: "gyros-tray" },
        { n: "Souvlaki sticks", d: "Pork or chicken · each", p: "$7.00", img: "souvlaki-stick" },
        { n: "Beef kebobs", d: "Each", p: "$7.00", img: "beef-kabob-dinner" },
        { n: "Lamb chops", d: "Each", p: "$8.00", img: "lamb-chops-dinner" }
      ] },
      { title: "Salads", side: "Small / large tray", items: [
        { n: "Greek salad", d: "", p: "$50 / $100", img: "greek-salad" },
        { n: "Village salad", d: "", p: "$65 / $130", img: "village-salad" }
      ] },
      { title: "Sides", side: "Small / large tray", items: [
        { n: "Fries", d: "", p: "$40 / $80", img: "french-fries" },
        { n: "Rice", d: "", p: "$50 / $100", img: "rice" },
        { n: "Roast potatoes", d: "", p: "$50 / $100", img: "roast-potatoes" },
        { n: "Grilled veggies", d: "", p: "$55 / $110", img: "baked-veggies" }
      ] }
    ] }
  ];

  var home = document.getElementById("home");
  var menu = document.getElementById("menu");
  var grid = document.getElementById("grid");
  var tabs = document.getElementById("tabs");
  var list = document.getElementById("list");
  var sheet = document.getElementById("sheet");
  var lastFocus = null;
  var ITEMS = [];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function src(name) { return "img/" + name + ".jpg"; }

  CATS.forEach(function (c) {
    var tile = el("button", "tile");
    tile.type = "button";
    tile.dataset.cat = c.id;
    var im = document.createElement("img");
    im.src = src(c.cover); im.alt = "";
    tile.appendChild(im);
    tile.appendChild(el("span", null, c.name));
    grid.appendChild(tile);

    var tab = el("button", "tab", c.name);
    tab.type = "button";
    tab.dataset.cat = c.id;
    tabs.appendChild(tab);

    var sec = el("section", "sec");
    sec.id = "sec-" + c.id;
    sec.appendChild(el("h2", null, c.name));
    c.groups.forEach(function (g) {
      if (g.title) {
        var h3 = el("h3");
        h3.appendChild(el("span", null, g.title));
        if (g.side) h3.appendChild(el("span", null, g.side));
        sec.appendChild(h3);
      }
      var ul = el("ul", "items");
      g.items.forEach(function (it) {
        var idx = ITEMS.push(it) - 1;
        var li = el("li");
        var row = el("button", "row");
        row.type = "button";
        row.dataset.item = idx;
        row.setAttribute("aria-label", it.n + ", " + it.p + ". Show photo");
        var text = el("span", "row-text");
        text.appendChild(el("span", "row-name", it.n));
        if (it.d) text.appendChild(el("span", "row-note", it.d));
        text.appendChild(el("span", "row-price", it.p));
        row.appendChild(text);
        var th = document.createElement("img");
        th.src = src(it.img); th.alt = ""; th.loading = "lazy"; th.width = 88; th.height = 88;
        row.appendChild(th);
        li.appendChild(row);
        ul.appendChild(li);
      });
      sec.appendChild(ul);
    });
    list.appendChild(sec);
  });

  function setActive(id) {
    Array.prototype.forEach.call(tabs.children, function (t) {
      var on = t.dataset.cat === id;
      if (on) {
        t.setAttribute("aria-current", "true");
        var left = t.offsetLeft - (tabs.clientWidth - t.offsetWidth) / 2;
        tabs.scrollLeft = Math.max(0, left);
      } else {
        t.removeAttribute("aria-current");
      }
    });
  }

  function jump(id) {
    var sec = document.getElementById("sec-" + id);
    if (sec) sec.scrollIntoView();
    setActive(id);
  }

  function openMenu(id) {
    home.hidden = true;
    menu.hidden = false;
    window.scrollTo(0, 0);
    jump(id);
  }
  function openHome() {
    menu.hidden = true;
    home.hidden = false;
    window.scrollTo(0, 0);
  }

  grid.addEventListener("click", function (e) {
    var t = e.target.closest(".tile");
    if (t) openMenu(t.dataset.cat);
  });
  tabs.addEventListener("click", function (e) {
    var t = e.target.closest(".tab");
    if (t) jump(t.dataset.cat);
  });
  document.getElementById("back").addEventListener("click", openHome);

  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) setActive(en.target.id.replace("sec-", ""));
      });
    }, { rootMargin: "-130px 0px -70% 0px" });
    Array.prototype.forEach.call(list.children, function (s) { io.observe(s); });
  }

  function openSheet(it, from) {
    lastFocus = from;
    document.getElementById("sheetImg").src = src(it.img);
    document.getElementById("sheetImg").alt = it.n;
    document.getElementById("sheetName").textContent = it.n;
    var note = document.getElementById("sheetNote");
    note.textContent = it.d || "";
    note.hidden = !it.d;
    document.getElementById("sheetPrice").textContent = it.p;
    sheet.hidden = false;
    document.getElementById("sheetClose").focus();
  }
  function closeSheet() {
    sheet.hidden = true;
    if (lastFocus) lastFocus.focus();
  }
  list.addEventListener("click", function (e) {
    var r = e.target.closest(".row");
    if (r) openSheet(ITEMS[Number(r.dataset.item)], r);
  });
  document.getElementById("sheetClose").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });
  sheet.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

  var start = (location.hash || "").replace("#", "");
  if (CATS.some(function (c) { return c.id === start; })) openMenu(start);
})();
</script>
</body>
</html>
